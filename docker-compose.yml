name: entre-nos

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: entre_nos
      POSTGRES_USER: entre_nos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entre_nos_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entre_nos -d entre_nos"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://entre_nos:${POSTGRES_PASSWORD:-entre_nos_dev}@db:5432/entre_nos
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

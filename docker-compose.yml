name: entre-nos

# Senhas sem default: defina no .env (veja .env.example). Gere com `openssl rand -hex 24`.
x-postgres-password: &postgres-password ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}
x-app-db-password: &app-db-password ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env (openssl rand -hex 24)}

services:
  db:
    build: { context: ., dockerfile: docker/postgres/Dockerfile, target: db }
    environment:
      POSTGRES_DB: entre_nos
      POSTGRES_USER: entre_nos
      POSTGRES_PASSWORD: *postgres-password
      WALG_S3_PREFIX: s3://${BACKUP_S3_BUCKET:?defina BACKUP_S3_BUCKET no .env}/${BACKUP_S3_PATH:-entre-nos}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?defina BACKUP_S3_ENDPOINT no .env}
      AWS_REGION: ${BACKUP_S3_REGION:-auto}
      AWS_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-true}"
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?defina BACKUP_S3_ACCESS_KEY_ID no .env}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?defina BACKUP_S3_SECRET_ACCESS_KEY no .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entre_nos -d entre_nos"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot com o dono do banco: aplica as migrations e garante o papel entre_nos_app.
  # Constrói a imagem; o app reusa a mesma (um build só).
  migrate:
    image: entre-nos-app
    build: .
    command: ["node", "apps/server/src/db/migrate-cli.ts"]
    environment:
      MIGRATION_DATABASE_URL: postgres://entre_nos:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}@db:5432/entre_nos
      APP_DB_PASSWORD: *app-db-password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Só serve, com o papel sem bypass de RLS (ADR 0005); nunca vê as credenciais do dono.
  app:
    image: entre-nos-app
    environment:
      DATABASE_URL: postgres://entre_nos_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env (openssl rand -hex 24)}@db:5432/entre_nos
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backup contínuo (ADR 0003) com o dono do banco; o app nunca vê estas credenciais (ADR 0005).
  backup:
    build: { context: ., dockerfile: docker/postgres/Dockerfile, target: backup }
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: entre_nos
      PGDATABASE: entre_nos
      PGPASSWORD: *postgres-password
      PGDATA: /var/lib/postgresql/18/docker
      APP_DB_PASSWORD: *app-db-password
      BACKUP_RETAIN_FULL: ${BACKUP_RETAIN_FULL:-14}
      WALG_S3_PREFIX: s3://${BACKUP_S3_BUCKET:?defina BACKUP_S3_BUCKET no .env}/${BACKUP_S3_PATH:-entre-nos}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?defina BACKUP_S3_ENDPOINT no .env}
      AWS_REGION: ${BACKUP_S3_REGION:-auto}
      AWS_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-true}"
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?defina BACKUP_S3_ACCESS_KEY_ID no .env}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?defina BACKUP_S3_SECRET_ACCESS_KEY no .env}
    volumes:
      - db-data:/var/lib/postgresql
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # S3 local, só para provar o backup na máquina de dev (`--profile local-s3`).
  s3-local:
    profiles: ["local-s3"]
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY_ID:?defina BACKUP_S3_ACCESS_KEY_ID no .env}
      RUSTFS_SECRET_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?defina BACKUP_S3_SECRET_ACCESS_KEY no .env}
    ports:
      - "127.0.0.1:${S3_LOCAL_PORT:-9105}:9000"
      - "127.0.0.1:${S3_LOCAL_CONSOLE_PORT:-9106}:9001"
    volumes:
      - s3-local-data:/data

  # Cria o bucket no S3 local (one-shot).
  s3-init:
    profiles: ["local-s3"]
    image: amazon/aws-cli:2.39.4
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?defina BACKUP_S3_ACCESS_KEY_ID no .env}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?defina BACKUP_S3_SECRET_ACCESS_KEY no .env}
      AWS_REGION: us-east-1
      BUCKET: ${BACKUP_S3_BUCKET:?defina BACKUP_S3_BUCKET no .env}
    command:
      - |
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://s3-local:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null ||
             aws --endpoint-url http://s3-local:9000 s3 mb "s3://$$BUCKET"; then
            exit 0
          fi
          sleep 1
        done
        echo "s3-init: bucket $$BUCKET não ficou pronto" >&2
        exit 1
    restart: "no"

volumes:
  db-data:
  s3-local-data:

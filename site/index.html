<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A0A">
<meta name="robots" content="noindex">
<title>Entre Nós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500;1,6..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma tela de celular por vez (fluxo de entrada), centralizada; à noite, só os dois. Visual único escuro, de propósito. */
:root{
  --night:#0D0A0A;      /* fundo: preto quente */
  --night-2:#191414;    /* cartões: grafite */
  --line:#352B2B;       /* bordas: cinza quente */
  --blush:#A01E2B;      /* vinho/vermelho principal */
  --honey:#C8A15A;      /* dourado, traço de destaque */
  --cream:#F2EBE5;      /* texto */
  --muted:#A69C99;      /* texto secundário: cinza */
  --display:"Bodoni Moda", Didot, Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% -10%, #3A0F15 0%, transparent 60%),radial-gradient(80% 40% at 100% 110%, #1E1414 0%, transparent 70%);background-attachment:fixed}
.app{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:20px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.mark{font-family:var(--display);font-style:italic;font-size:20px;color:var(--cream);letter-spacing:.01em}
.mark b{color:var(--honey);font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 12px var(--body);padding:6px 11px;cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--blush);color:var(--cream)}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:22px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,11vw,54px);line-height:1.02;margin:0;text-wrap:balance}
h1 em{color:var(--honey)}
h2{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h2 em{color:var(--honey)}
p{margin:0;color:var(--muted)}
.lead{font-size:17px;color:var(--cream);opacity:.9;max-width:34ch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--honey)}
.spacer{flex:1}
.btn{appearance:none;border:0;border-radius:16px;padding:16px 18px;font:700 16px var(--body);cursor:pointer;width:100%;transition:transform .12s, filter .12s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--blush);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(200,161,90,.6)}
.btn.gold{background:var(--honey);color:var(--night)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.link{background:none;color:var(--muted);padding:8px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.lang button:focus-visible,.opt:focus-visible,.key:focus-visible,.tile:focus-visible,input:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.btns{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--cream);font:500 16px var(--body);width:100%}
input::placeholder{color:#6E6564}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:16px 12px;color:var(--cream);font:600 15px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt .ic{font-size:26px}
.opt[aria-pressed="true"]{border-color:var(--honey);background:#241A1A;box-shadow:inset 0 0 0 1px var(--honey)}
.hint{font-size:13px;color:var(--muted)}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--blush)}
/* PIN */
.dots{display:flex;gap:16px;justify-content:center;padding:10px 0}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--blush)}
.dots span.f{background:var(--blush)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto;width:100%}
.key{aspect-ratio:1.35;max-width:100%;border-radius:18px;background:var(--night-2);border:1px solid var(--line);color:var(--cream);font:500 26px var(--display);cursor:pointer}
.key.sm{font:600 13px var(--body);color:var(--muted)}
.key:active{background:#2A1C1D}
.center{text-align:center;align-items:center}
/* tour */
.tour{background:var(--night-2);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;min-height:280px}
.tour .big{font-size:44px}
.tdots{display:flex;gap:8px;justify-content:center}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--honey);width:22px;border-radius:8px}
/* convite */
.invite{background:linear-gradient(160deg,#2A1215,#191414);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--night);border:1px dashed var(--honey);border-radius:12px;padding:10px 12px}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;font:500 13px ui-monospace,Menlo,monospace;color:var(--honey)}
.copy{background:var(--honey);color:var(--night);border:0;border-radius:10px;padding:8px 12px;font:700 13px var(--body);cursor:pointer;white-space:nowrap}
.msg{background:var(--night);border-radius:14px;padding:14px;font-size:14px;color:var(--cream);white-space:pre-line;border-left:3px solid var(--honey)}
/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bell{position:relative;background:var(--night-2);border:1px solid var(--line);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--cream);flex:none}
.bell b{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--honey);box-shadow:0 0 0 2px var(--night-2)}
.couple{display:flex;align-items:center;gap:12px;background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:14px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--body);color:var(--night);flex:none}
.av.a{background:var(--blush);color:var(--cream)}.av.b{background:var(--line);color:var(--muted);margin-left:-18px;border:2px dashed var(--muted)}
.av.b.ok{background:var(--honey);color:var(--night);border:2px solid var(--night-2)}
.couple div{min-width:0}
.couple small{display:block;color:var(--muted);font-size:13px}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;color:var(--cream);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile .ic{font-size:22px}
.tile strong{font-size:15px;line-height:1.2}
.tile span{font-size:12px;color:var(--muted);line-height:1.3}
.tile.hero{grid-column:1/-1;background:linear-gradient(140deg,#4A0F18,#191414);border-color:#6E3A2E;min-height:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--night);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:20}
.protonote{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:#6E6564;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.protonote button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;font:600 12px var(--body);cursor:pointer}
/* Pergunte sem vergonha */
button:focus-visible,textarea:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.back{background:none;border:0;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:4px 0;align-self:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg-b{background:none;border:0;border-radius:10px;padding:10px 6px;color:var(--muted);font:600 14px var(--body);cursor:pointer}
.seg-b[aria-pressed="true"]{background:var(--blush);color:var(--cream)}
.note{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--cream);display:flex;gap:8px;align-items:flex-start}
.note .svg{margin-top:2px;color:var(--honey)}
textarea{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--cream);font:500 16px/1.45 var(--body);width:100%;resize:vertical}
.qcard textarea{background:var(--night)}
textarea::placeholder{color:#6E6564}
.rec{background:transparent;border:1px solid var(--honey);color:var(--honey);border-radius:999px;padding:10px 16px;font:600 14px var(--body);cursor:pointer}
.rec.on{background:var(--honey);color:var(--night)}
.rec.live{border-color:var(--blush);color:var(--cream);background:var(--blush);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;border-radius:12px}
.qcard{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qtext{color:var(--cream);font-family:var(--display);font-style:italic;font-size:19px;line-height:1.3}
.meter{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:4px}.pips i{width:22px;height:5px;border-radius:3px;background:var(--line)}.pips i.on{background:var(--honey)}
.meter small,.to{font-size:12px;color:var(--muted)}
.qhead{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;width:100%}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.tag.ok{color:var(--night);background:var(--honey);border-color:var(--honey)}
.answers{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ans{background:var(--night);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ans p{color:var(--cream);font-size:15px}
.ans.team{border:1px solid var(--honey)}
.ans.audio{flex-direction:row;align-items:center;gap:12px}
.badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--honey)}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--blush);color:var(--cream);cursor:pointer;flex:none}
.wave{flex:1;min-width:0;height:20px;background:repeating-linear-gradient(90deg,var(--muted) 0 2px,transparent 2px 6px);opacity:.45;border-radius:4px}
.ans.audio small{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px}
.rules{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.qcard .rules{background:var(--night)}
.rules summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--honey);padding:10px 0;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:" ▾"}
.rules[open] summary::after{content:" ▴"}
.rbody{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.ex{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;color:var(--cream);background:var(--night)}
.qcard .ex{background:var(--night-2)}
.ex b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.ex.ok{border-left:3px solid #6FAF7F}.ex.ok b{color:#8FC79C}
.ex.no{border-left:3px solid var(--blush)}.ex.no b{color:#E07A84}
.ex.no span{text-decoration:line-through;text-decoration-color:rgba(224,122,132,.6)}
.thread{display:flex;flex-direction:column;gap:8px;margin-left:10px;border-left:2px solid var(--line);padding-left:12px}
.bub{font-size:14px;color:var(--cream);line-height:1.4}
.bub small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bub.me small{color:var(--honey)}
.more{background:none;border:0;color:var(--honey);font:600 13px var(--body);cursor:pointer;padding:2px 0;text-align:left}
.limit{font-size:12px;color:var(--muted)}
.fu{border-color:var(--honey)}
.rlist{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
/* Posições */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--night-2);border:1px solid var(--line);color:var(--cream);border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--honey);color:var(--honey);background:#241A1A}
.oinfo{border-left:3px solid var(--honey);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.oinfo strong{font-family:var(--display);font-style:italic;font-weight:500;font-size:19px;color:var(--honey)}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;color:var(--cream);cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit}
.pt{font-family:var(--display);font-size:21px;line-height:1.15}
.dn{color:var(--honey);font-style:normal;font-size:16px}
.po{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--honey)}
.pd{font-size:14px;color:var(--muted);line-height:1.4}
.mts{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.mt{display:flex;flex-direction:column;gap:4px}
.mt small{font-size:11px;color:var(--muted);letter-spacing:.04em}
.dots5{display:flex;gap:3px}.dots5 i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots5 i.on{background:var(--cream)}.mt.h .dots5 i.on{background:var(--blush)}
.mts.big .dots5 i{width:22px;height:6px}
.stage{position:relative;width:100%;height:340px;border-radius:22px;overflow:hidden;background:radial-gradient(90% 80% at 50% 30%,#2A1416,#0D0A0A);border:1px solid var(--line)}
.stage canvas{display:block}
.drag,.legend{position:absolute;top:10px;font-size:12px;color:var(--muted);pointer-events:none;z-index:1}
.drag{left:12px}.legend{right:12px;display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}.lw{background:#E2B8A0}.lm{background:#B98A6C}
.no3d{position:absolute;left:16px;right:16px;bottom:16px;color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--night-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--cream);min-width:0}
.facts small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.tip{border-radius:14px;padding:12px 14px;font-size:15px;color:var(--cream);background:var(--night-2)}
.tip b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.tip.her{border-left:3px solid var(--blush)}.tip.her b{color:#E07A84}
.tip.him{border-left:3px solid var(--muted)}.tip.him b{color:var(--muted)}
/* ícones, desktop, bolinhas */
.svg{display:block;flex:none}
.hint .svg,p .svg{display:inline-block;vertical-align:-2px;margin-right:4px}
.tile .ic,.opt .ic{color:var(--honey);display:flex}
.tile.hero .ic{color:var(--cream)}
.bigic{color:var(--honey)}
.bell .svg{margin:auto}
.lockov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.locksh{background:var(--night-2);border:1px solid var(--line);border-radius:22px;padding:22px 20px 16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px}
.locksh h2{margin:0}.locksh p{margin:0 0 6px;color:var(--muted)}.lockic{color:var(--honey);display:grid;width:44px;height:44px;place-items:center;border-radius:14px;background:rgba(200,161,90,.12)}
.tile.locked{position:relative;opacity:.72}.tile.locked .lk{position:absolute;top:12px;right:12px;color:var(--honey);display:grid}
.newsbox{display:flex;flex-direction:column;gap:8px;margin:2px 0 16px;padding:14px;border-radius:18px;border:1px solid var(--honey);background:rgba(200,161,90,.08)}
.newsit{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px 6px;border:0;border-radius:12px;background:none;color:var(--cream);font:inherit;font-size:15px;cursor:pointer}
.newsit:hover{background:rgba(255,255,255,.04)}.newsit .gic{flex:none;width:36px;height:36px;color:var(--honey)}
.tile.hasnew{position:relative;border-color:var(--honey)}.tile .ndot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--honey);box-shadow:0 0 0 3px rgba(200,161,90,.25)}
.tile.locked.hasnew .ndot{right:32px}
.bub2.canedit{cursor:pointer}.bub2.canedit::after{content:attr(data-edl);display:block;margin-top:4px;font-size:11px;opacity:.7;text-decoration:underline}
.real .bell b{display:none}.real .bell.new b{display:block}
.annc{display:flex;gap:12px;align-items:center;text-align:left;width:100%;margin:4px 0 14px;padding:12px 14px;border-radius:16px;border:1px solid var(--honey);background:rgba(200,161,90,.1);color:var(--cream);cursor:pointer;font:inherit}
.annc>span:first-child{color:var(--honey);flex:none;display:grid}.annc strong{display:block}.annc small{display:block;color:var(--muted);font-size:14px}
.rec{display:inline-flex;align-items:center;gap:8px}
.seg-b{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.three .opt{padding:14px 6px;font-size:14px}
.chips{flex-wrap:wrap;overflow:visible}
.lvd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--muted)}
.lvd.l1{background:#8FC79C}.lvd.l2{background:var(--honey)}.lvd.l3{background:#E07A84}
.count{color:var(--honey);font-weight:600;white-space:nowrap}
.newb{color:var(--cream);font-weight:700}
.how{display:flex;flex-direction:column;gap:10px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.45;color:var(--cream)}
.how li::before{content:counter(st);width:26px;height:26px;border-radius:50%;border:1px solid var(--honey);color:var(--honey);font:600 13px var(--body);display:grid;place-items:center}
.wcard{background:linear-gradient(160deg,#2A1215,#191414);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:18px;min-height:240px}
.wtop{display:flex;justify-content:space-between;align-items:center}
.wtext{font-family:var(--display);font-size:clamp(24px,6vw,30px);line-height:1.2;color:var(--cream);flex:1;display:flex;align-items:center}

    case 'tkrevsend':if(!S.tk.sel)break;S.tk.msgs.push({who:'me',kind:'wish',key:S.tk.sel,text:(S.tkRevDraft||t().g2.tkRevealMsg).trim()});S.tk.mode=null;S.tkRevDraft='';talkReply();break;
    case 'tksend':{const tx=S.tkDraft.trim();if(!tx)break;S.tk.msgs.push({who:'me',kind:'text',text:tx});S.tkDraft='';talkReply();break}
    case 'dshare':{const id=a.dataset.id,d=S.diary[id];d.shared=!d.shared;render();if(d.shared){toast(t().g2.dySharedToast);if(!S.dpc[id]&&!window.REAL)setTimeout(()=>{S.dpc[id]=lang==='pt'?'Topo repetir essa logo 😏':'Me apunto a repetirla pronto 😏';toast(t().g2.dyTheyCmt);if(S.screen==='diary')render()},2500)}break}
    case 'dcmt':{const id=a.dataset.id,tx=(S.dcDraft[id]||'').trim();if(!tx)break;S.dmc[id]=tx;render();toast(t().g2.dyCmtSent);break}
    case 'dopen':S.pid=a.dataset.id;S.posScroll=0;go('pos');break;
    case 'pretray':{const id=S.pexp,j=S.tray.indexOf(id);j>=0?S.tray.splice(j,1):S.tray.push(id);render();break}
    case 'tropen':S.compose=true;render();requestAnimationFrame(()=>{const c=document.getElementById('comp');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})});break;
    case 'trcancel':S.compose=false;render();break;
    case 'trsend':{S.sh.push({keys:S.tray.map(id=>'pre:'+id),from:'me',mode:S.trMode,msg:S.trMsg.trim()});const i2=S.sh.length-1;const m=S.trMode;S.tray=[];S.trMsg='';S.compose=false;render();toast(m==='sur'?CT().surSent:CT().askSent);
      if(!window.REAL)setTimeout(()=>{S.shc[i2]=Object.assign(S.shc[i2]||{},{them:lang==='pt'?(m==='sur'?'Fiquei curioso o dia todo 😏':'Pode deixar, vou fazer tudinho 😏'):(m==='sur'?'Me quedé con la intriga todo el día 😏':'Déjamelo a mí, lo haré todo 😏')});toast(CT().theyCmt);if(S.screen==='pre')render()},2600);break}
    case 'gocg':S.cg.done=false;go('concierge');break;
    case 'toycg':{const id=S.texp;S.cg.sel.has(id)?S.cg.sel.delete(id):S.cg.sel.add(id);render();break}
    case 'cgsend':if(!S.cg.sel.size||!S.cg.ct.trim()){toast(CT().cgErr);break}S.cg.done=true;render();toast(CT().cgDone);break;
    case 'prewish':{const k='pre:'+S.pexp;S.wl.has(k)?S.wl.delete(k):S.wl.add(k);render();toast(S.wl.has(k)?L.p.addedWish:L.p.removedWish);break}
    case 'bdx':{S.bdx=!S.bdx;S.texp=null;render();break}
    case 'toywish':{const k='toy:'+S.texp;S.wl.has(k)?S.wl.delete(k):S.wl.add(k);render();toast(S.wl.has(k)?L.p.addedWish:L.p.removedWish);break}
    case 'toyshare':{const k='toy:'+S.texp;if(!S.sh.some(e=>e.from==='me'&&e.key===k)){shPush(k,'share');render();toast(CT().sharedToast)}break}
    case 'shopen':S.sh[i].open=true;render();break;
    case 'shcmt':{const tx=(S.scDraft[i]||'').trim();if(!tx)break;S.shc[i]=Object.assign(S.shc[i]||{},{me:tx});render();toast(CT().cmtSent);break}
    case 'ghub':S.gm.game=null;render();break;
    case 'gidea':S.gm.ideas=!S.gm.ideas;render();break;
    case 'gsend':{const tx=S.gdraft.trim();if(!tx)break;S.gm.chat.push({who:'me',text:tx});S.gdraft='';S.gm.ideas=false;partnerTurn(S.gm.game);break}
    case 'gend':S.gm.ended=true;render();break;
    case 'gnewscene':S.gm.scene=(S.gm.scene+1)%SCENES.length;S.gm.chat=[];S.gm.ended=false;S.gm.turn='me';render();break;
    case 'gsave':toast(GTX().saved);break;
    case 'gplansend':S.gm.plan.stage='wait';render();setTimeout(()=>{S.gm.plan.stage='done';if(S.screen==='games')render();toast(t().w.partnerDone)},1800);break;
    case 'tdone':case 'tskip':{const d=S.gm.tod;if(a.dataset.act==='tskip'){if(!d.skip)break;d.skip=false;d.i++;render();break}d.theirs={k:d.i%2?'t':'d',i:d.i+1};d.stage='theirs';S.gdraft='';render();break}
    case 'tnext':{const d=S.gm.tod;d.i+=2;d.stage='pick';d.kind=null;render();break}
    case 'tsend':{const T2=S.gm.tease;T2.text=S.gdraft.trim()||TEASES[lang][T2.sel];T2.sent=true;S.gdraft='';render();toast(GTX().teaseSent);break}
    case 'posl':go('posl');{const y=S.posScroll||0;requestAnimationFrame(()=>window.scrollTo(0,y))}break;
    case 'pdone':if(!S.diary[S.pid]){S.diary[S.pid]={rating:0,note:'',shared:false};render();toast(L.p.doneToast)}else{S.dtab='mine';go('diary')}break;
    case 'pwish':{const k='pos:'+S.pid;if(S.wl.has(k)){S.wl.delete(k);toast(L.p.removedWish)}else{S.wl.add(k);toast(L.p.addedWish)}render();break}
    case 'godiary':S.dtab='mine';go('diary');break;
    case 'rec':S.rec=true;S.recSecs=0;S.audio=null;render();recTimer=setInterval(()=>{S.recSecs=Math.min(S.recSecs+1,30);if(S.recSecs>=30){S.audio='30';stopRec();render();toast(t().q.recMax);return}const el=document.getElementById('rect');if(el)el.textContent='0:'+String(S.recSecs).padStart(2,'0')+' / 0:30'},1000);break;
    case 'recstop':S.audio=String(Math.max(S.recSecs,3)).padStart(2,'0');stopRec();render();break;
    case 'recdel':S.audio=null;render();break;
    case 'sendq':{const txt=S.draft.trim();if((!txt&&!S.audio)||!S.box){toast(Q.errQ);break}
      {const c=checkText(txt);if(c){toast(c==='link'?Q.errLink:Q.errBad);break}}
      S.mine.unshift({text:txt,audio:S.audio,box:S.box,open:false,helped:false,answers:[]});
      S.draft='';S.audio=null;S.box=null;S.askTab='mine';render();toast(Q.sent);break}
    case 'reply':S.replying=a.dataset.arr+i;S.ansDraft='';S.ansAudio=false;render();break;
    case 'ansrec':S.ansAudio=!S.ansAudio;render();break;
    case 'sendans':{if(!S.ansDraft.trim()&&!S.ansAudio){toast(Q.errA);break}
      {const c=checkText(S.ansDraft);if(c){toast(c==='link'?Q.errLink:Q.errBad);break}}
      const list=S.mural[a.dataset.arr];list[i].n++;S.replying=-1;
      if(list[i].n>=3){list.splice(i,1);toast(Q.ansDone)}else toast(Q.ansSent);render();break}
    case 'report':S.mural[a.dataset.arr].splice(i,1);S.replying=-1;render();toast(Q.reported);break;
    case 'toggle':S.mine[i].open=!S.mine[i].open;render();break;
    case 'helped':S.mine[i].helped=true;render();toast(Q.thanks);break;
    case 'play':toast(Q.playing);break;
    case 'fuopen':S.fuOpen=a.dataset.i+'-'+a.dataset.j;S.fuDraft='';render();break;
    case 'fusend':{const txt=S.fuDraft.trim();if(!txt){toast(Q.errA);break}
      {const c=checkText(txt);if(c){toast(c==='link'?Q.errLink:Q.errBad);break}}
      const ans=S.mine[i].answers[+a.dataset.j];ans.thread=ans.thread||[];ans.thread.push({who:'me',text:txt});
      S.fuOpen=null;S.fuDraft='';render();toast(Q.moreSent);
      setTimeout(()=>{ans.thread.push({who:'them',k:'auto'});if(S.screen==='ask'&&S.askTab==='mine')render();toast(t().q.moreGot)},2600);break}
    case 'fureply':{const txt=S.frDraft.trim();if(!txt){toast(Q.errA);break}
      {const c=checkText(txt);if(c){toast(c==='link'?Q.errLink:Q.errBad);break}}
      S.followIn.splice(i,1);S.frDraft='';render();toast(Q.fuSent);break}
    case 'signup':go('signup');break;
    case 'login':go('login');break;
    case 'buy':toast(lang==='pt'?'Aqui vai o botão pro checkout da Hotmart':'Aquí va el botón al checkout de Hotmart');break;
    case 'forgot':toast(lang==='pt'?'Enviaremos um link pro seu e-mail':'Enviaremos un enlace a tu correo');break;
    case 'tournext':if(S.tour<L.tour.length-1){S.tour++;render()}else finishEntry();break;
    case 'tourskip':finishEntry();break;
    case 'copylink':copyText('https://'+inviteLink(),L.copied);break;
    case 'copymsg':copyText(L.i_msg(S.name)+'https://'+inviteLink(),L.msg_copied);break;
    case 'later':go('home');break;
    case 'resend':go('invite');break;
    case 'accept':S.partner=true;go('home');toast(lang==='pt'?'Contas ligadas 💞':'Cuentas conectadas 💞');break;
    case 'welcome':go('welcome');break;
    case 'bell':toast(L.bell);break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='qt')S.draft=e.target.value;else if(e.target.id==='at')S.ansDraft=e.target.value;else if(e.target.id==='ft')S.fuDraft=e.target.value;else if(e.target.id==='own')S.ownDraft=e.target.value;else if(e.target.id==='mgn')S.mg.name=e.target.value;else if(e.target.id==='mgage')S.mg.age=e.target.checked;else if(e.target.id==='gin')S.gdraft=e.target.value;else if(e.target.id==='tkin')S.tkDraft=e.target.value;else if(e.target.id==='tkrev')S.tkRevDraft=e.target.value;else if(e.target.dataset.dn){S.diary[e.target.dataset.dn].note=e.target.value}else if(e.target.dataset.dc){S.dcDraft[e.target.dataset.dc]=e.target.value}else if(e.target.dataset.sc!=null){S.scDraft[e.target.dataset.sc]=e.target.value}else if(e.target.id==='trmsg')S.trMsg=e.target.value;else if(e.target.id==='cgct')S.cg.ct=e.target.value;else if(e.target.id==='cgmsg')S.cg.msg=e.target.value;else if(e.target.dataset.cg){const id=e.target.dataset.cg;e.target.checked?S.cg.sel.add(id):S.cg.sel.delete(id)}else if(e.target.dataset.wl){const k=e.target.dataset.wl;e.target.checked?S.wl.add(k):S.wl.delete(k)}else if(e.target.dataset.tkt!=null){S.tk.sel=+e.target.dataset.tkt}else if(e.target.dataset.tkr){S.tk.sel=e.target.dataset.tkr}else if(e.target.dataset.pl)S.gm.plan.sel[e.target.dataset.pl]=e.target.checked;else if(e.target.dataset.tz!=null){S.gm.tease.sel=+e.target.dataset.tz;S.gdraft='';const gi=document.getElementById('gin');if(gi)gi.value=''}else if(e.target.id==='fr')S.frDraft=e.target.value;});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f')return;e.preventDefault();
  const nm=document.getElementById('nm').value.trim(),em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value,pe=document.getElementById('pem').value.trim();
  if(!nm||!em||!pe||pw.length<6||!S.gender){toast(t().err_fill);return}
  S.pemail=pe;
  S.name=nm;S.email=em;S.pinStage=1;go('pin');
});
render();
</script>
